name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_ROOT_PASSWORD: emailagent-test-root
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: emailagent-test-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pemailagent-test-root --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:backend
      - run: npm run build

  packaged-desktop:
    name: Package and start (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            runner: macos-latest
            package-script: package:mac
            verify-script: verify:package:mac
            archive: EmailAgent-mac-arm64.zip
            archive-command: cd release && zip -qry ../EmailAgent-mac-arm64.zip .
          - platform: Windows
            runner: windows-latest
            package-script: package:win
            verify-script: verify:package:win
            archive: EmailAgent-win-x64.zip
            archive-command: Compress-Archive -Path release\* -DestinationPath EmailAgent-win-x64.zip
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.package-script }}
      - run: npm run ${{ matrix.verify-script }}
      - name: Archive application
        run: ${{ matrix.archive-command }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          retention-days: 7
